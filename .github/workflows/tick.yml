# Every 10 minutes: wake the server, refresh filings and prices, and send background alerts.
# Keeping the free Render instance awake also means nobody waits ~50 s for a cold start.
# (750 free instance-hours a month covers one service running all month.)
name: tick
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping FINN
        run: curl -sS --max-time 180 "${FINN_URL:-https://finn-6xsx.onrender.com}/api/tick" || true
        env:
          FINN_URL: ${{ vars.FINN_URL }}
