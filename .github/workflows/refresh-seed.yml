# Nightly: pull EOD prices, filings and fundamentals, rebuild dossiers, commit the seed snapshot.
# The deployed app then always boots with recent data even if a source blocks the host's IP.
name: refresh-seed
on:
  schedule: [{ cron: "30 12 * * 1-5" }]   # 18:00 IST, after market close
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Refresh and export
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m finn.snapshot import
          python -m finn.refresh
          python -m finn.snapshot export
      - run: |
          git config user.name "finn-bot"; git config user.email "finn-bot@users.noreply.github.com"
          git add seed/seed.json.gz && git commit -m "Refresh seed snapshot" || echo "no changes"
          git push
